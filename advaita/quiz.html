<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Readiness Quiz — Advaita</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container-narrow">
  <nav>
    <a href="index.html" class="logo" style="text-decoration: none; color: inherit;">Advaita<span style="color: var(--accent);">.</span></a>
    <span style="color: var(--muted); font-size: 14px;" id="qcount">Question 1 of 10</span>
  </nav>

  <div class="quiz-shell">
    <div class="progress"><div class="progress-bar" id="bar" style="width: 10%;"></div></div>

    <div id="quiz-root"></div>

    <div class="nav-row">
      <button id="back" class="btn btn-outline" style="visibility: hidden;">← Back</button>
      <button id="next" class="btn" disabled style="opacity: 0.4;">Next →</button>
    </div>
  </div>
</div>

<script src="quiz.js"></script>
</body>
</html>
