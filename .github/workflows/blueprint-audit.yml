name: blueprint-audit

# Runs the blueprint regression invariants automatically on every push/PR.
# Before this workflow the 16-check tripwire suite + run-audit only fired in the
# local pre-commit hook — a direct push (or a file dropped outside git) bypassed
# every red-line. CI closes that gap: the invariants now gate the remote too.

on:
  push:
    branches: [main]
    paths:
      - "blueprints/**"
      - "run-audit.py"
      - "financial-realism-check.py"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/blueprint-audit.yml"
      - "apply/**"
      - "apply.html"
      - "index.html"
      - "advaita-lp.html"
  pull_request:
    paths:
      - "blueprints/**"
      - "run-audit.py"
      - "financial-realism-check.py"
      - "scripts/**"
      - "tests/**"
      - "apply/**"
      - "apply.html"
      - "index.html"
      - "advaita-lp.html"

jobs:
  regression-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run blueprint regression tripwire suite (stdlib-only)
        run: python3 tests/test_blueprint_regressions.py

      # BLUEPRINT-INTAKE-URL-CANONICAL-20260805 — one intake form, one URL, forever.
      # https://blueprint.meetadvaita.com/ is the ONLY Advaita Blueprint intake form.
      # The stale form previously served at /apply/ returned HTTP 200, so "the link works"
      # was true and useless. Self-test runs first so a broken gate can never pass silently.
      - name: Intake-URL gate self-test (both directions + mutant kill)
        run: python3 scripts/blueprint_intake_url_gate.py --self-test

      - name: Intake-URL gate (blocking — only blueprint.meetadvaita.com may be the intake form)
        run: python3 scripts/blueprint_intake_url_gate.py
