<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mike Norton — AI Walkthrough (Origins)</title>
<style>
  *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#0d1117;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{background:#161b22;border-radius:20px;padding:32px 24px;max-width:480px;width:100%;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.4)}
  .tag{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#0071E3;font-weight:700;margin-bottom:8px}
  h1{font-size:22px;line-height:1.3;margin:0 0 6px}
  .sub{color:#8b949e;font-size:14px;margin:0 0 24px}
  audio{width:100%;margin:8px 0 20px}
  .lbl{font-size:13px;color:#8b949e;margin-bottom:10px}
  .speeds{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .speeds button{background:#21262d;color:#fff;border:1px solid #30363d;border-radius:10px;padding:12px 16px;font-size:15px;font-weight:600;cursor:pointer;min-width:64px}
  .speeds button.active{background:#0071E3;color:#fff;border-color:#0071E3}
  .foot{margin-top:24px;font-size:12px;color:#6e7681}
</style></head><body>
<div class="card">
  <div class="tag">Franchise KI &middot; AI Walkthrough</div>
  <h1>Mike &mdash; your Origins walkthrough</h1>
  <p class="sub">~37 min &middot; built for you and Origins</p>
  <audio id="a" controls preload="metadata" src="https://bennett-maxwell.github.io/fki-preview/podcasts/mike-norton-origins-pilot-20260901.mp3"></audio>
  <div class="lbl">Playback speed</div>
  <div class="speeds" id="s">
    <button data-r="1">1x</button>
    <button data-r="1.25">1.25x</button>
    <button data-r="1.5">1.5x</button>
    <button data-r="2">2x</button>
  </div>
  <div class="foot">Tip: 1.5x finishes it in about 25 minutes. Your progress is saved automatically if you come back.</div>
</div>
<script>
  var a=document.getElementById('a'),btns=document.querySelectorAll('#s button');
  var KEY='mn-origins-podcast-pos';
  function setR(r,el){a.playbackRate=parseFloat(r);btns.forEach(function(b){b.classList.remove('active')});el.classList.add('active');try{localStorage.setItem('mn-origins-podcast-rate',r)}catch(e){}}
  btns.forEach(function(b){b.addEventListener('click',function(){setR(b.dataset.r,b)})});
  (function(){
    var savedRate='1.5';
    try{savedRate=localStorage.getItem('mn-origins-podcast-rate')||'1.5'}catch(e){}
    var d=document.querySelector('#s button[data-r="'+savedRate+'"]')||document.querySelector('#s button[data-r="1.5"]');
    setR(savedRate,d);
  })();
  a.addEventListener('loadedmetadata',function(){
    try{var saved=parseFloat(localStorage.getItem(KEY));if(saved&&saved>0&&saved<a.duration-5){a.currentTime=saved}}catch(e){}
  });
  a.addEventListener('timeupdate',function(){
    try{localStorage.setItem(KEY,a.currentTime)}catch(e){}
  });
</script></body></html>
