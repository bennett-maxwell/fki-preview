<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Redirecting to the live Blueprint application…</title>
  <meta name="robots" content="noindex,follow" />
  <meta http-equiv="refresh" content="0; url=https://franchiseki.com/apply" />
  <link rel="canonical" href="https://franchiseki.com/apply" />
  <style>
    :root {
      --bg: #0b1220;
      --card: #121b2d;
      --text: #f5f7fb;
      --muted: #a7b2c7;
      --accent: #4da3ff;
      --border: rgba(255,255,255,0.08);
      --shadow: 0 24px 80px rgba(0,0,0,0.35);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #16325f 0%, var(--bg) 58%);
      color: var(--text);
      padding: 24px;
    }
    .card {
      width: min(680px, 100%);
      background: rgba(18,27,45,0.96);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 36px;
      text-align: center;
    }
    .eyebrow {
      display: inline-block;
      font-size: 12px;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 14px;
      font-weight: 700;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(28px, 5vw, 42px);
      line-height: 1.08;
    }
    p {
      margin: 0 auto 18px;
      max-width: 52ch;
      color: var(--muted);
      line-height: 1.65;
      font-size: 16px;
    }
    a {
      display: inline-block;
      margin-top: 8px;
      padding: 14px 22px;
      border-radius: 999px;
      background: linear-gradient(135deg, #2c7be5, #61b1ff);
      color: white;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
  <script>
    window.location.replace('https://franchiseki.com/apply');
  </script>
</head>
<body>
  <main class="card">
    <div class="eyebrow">Franchise KI</div>
    <h1>Taking you to the live Blueprint application</h1>
    <p>This page now lives on the professional website. If you are not redirected automatically, use the button below.</p>
    <a href="https://franchiseki.com/apply">Open the live application</a>
  </main>
</body>
</html>
