<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="0; url=https://go.franchiseki.com/apply" />
  <link rel="canonical" href="https://go.franchiseki.com/apply" />
  <title>Apply — Franchise KI AI Blueprint</title>
  <meta name="description" content="Continue to the Franchise KI AI Blueprint application hosted in GoHighLevel." />
  <script>
    window.location.replace('https://go.franchiseki.com/apply');
  </script>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #eef6ff 0%, #ffffff 42%, #f7f7f7 100%);
      color: #0A0E1A;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      line-height: 1.5;
    }
    main {
      width: min(92vw, 560px);
      padding: 40px 32px;
      border: 1px solid #e6e8ef;
      border-radius: 20px;
      background: rgba(255,255,255,0.94);
      box-shadow: 0 24px 80px rgba(10,14,26,0.10);
      text-align: center;
    }
    .eyebrow {
      margin: 0 0 12px;
      color: #1D6FDB;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    h1 { margin: 0 0 12px; font-size: clamp(28px, 6vw, 42px); line-height: 1.08; }
    p { margin: 0 auto 24px; max-width: 420px; color: #3a3a3a; }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 22px;
      border-radius: 999px;
      background: #1D6FDB;
      color: #fff;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 12px 30px rgba(29,111,219,0.24);
    }
    a:focus { outline: 3px solid rgba(29,111,219,0.28); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Franchise KI</p>
    <h1>Taking you to the AI Blueprint application.</h1>
    <p>This page now routes to the GoHighLevel-hosted Franchise KI apply experience.</p>
    <a href="https://go.franchiseki.com/apply">Continue to application</a>
  </main>
</body>
</html>
