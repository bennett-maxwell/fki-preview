<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sky AI Training — June 11, 2026</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#1d1d1f;color:#f5f5f7;max-width:600px;margin:40px auto;padding:20px}
  h1{color:#0071e3;font-size:1.4rem;margin-bottom:4px}
  p{color:#86868b;font-size:.9rem;margin-bottom:20px}
  audio{width:100%;margin-bottom:16px}
  .speeds{display:flex;gap:8px;margin-bottom:24px}
  .speeds button{background:#2a2a2e;color:#f5f5f7;border:1px solid #3a3a3e;border-radius:6px;padding:8px 16px;cursor:pointer;font-size:.9rem}
  .speeds button.active{background:#0071e3;border-color:#0071e3}
  .speeds button:hover{background:#0071e3;border-color:#0071e3}
</style>
</head>
<body>
<h1>Sky AI Training Podcast</h1>
<p>Thursday, June 11, 2026 &bull; ~10 min</p>
<audio id="podAudio" controls preload="metadata" src="https://bennett-maxwell.github.io/fki-preview/podcasts/sky-training-2026-06-11.mp3"></audio>
<div class="speeds">
  <button data-rate="1" onclick="setRate(1,this)" class="active">1x</button>
  <button data-rate="1.25" onclick="setRate(1.25,this)">1.25x</button>
  <button data-rate="1.5" onclick="setRate(1.5,this)">1.5x</button>
  <button data-rate="2" onclick="setRate(2,this)">2x</button>
</div>
<script>
  var a=document.getElementById('podAudio'),KEY='sky-training-2026-06-11';
  function setRate(r,b){a.playbackRate=r;document.querySelectorAll('.speeds button').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');save();}
  function save(){try{localStorage.setItem(KEY,JSON.stringify({time:a.currentTime,rate:a.playbackRate}))}catch(e){}}
  (function(){try{var s=JSON.parse(localStorage.getItem(KEY)||'{}');if(s.rate)a.playbackRate=s.rate;a.addEventListener('loadedmetadata',()=>{if(s.time)a.currentTime=s.time;});}catch(e){}})();
  a.addEventListener('timeupdate',save);a.addEventListener('ratechange',save);
</script>
</body>
</html>
